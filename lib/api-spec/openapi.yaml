openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: JIIB Core Sync school management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: schools
    description: School resolution and configuration
  - name: dashboard
    description: Dashboard summaries
  - name: students
    description: Student records
  - name: marks
    description: Assessment marks
  - name: messages
    description: Parent and staff messages
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /schools/by-slug/{slug}:
    get:
      operationId: getSchoolBySlug
      tags: [schools]
      summary: Resolve a school from its URL slug
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: School record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/School"
        "404":
          description: School not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /schools:
    post:
      operationId: createSchool
      tags: [schools]
      summary: Register a school workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolRegistrationInput"
      responses:
        "201":
          description: Registered school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/School"
  /schools/{schoolId}/status:
    patch:
      operationId: updateSchoolStatus
      tags: [schools]
      summary: Activate or suspend a school workspace
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolStatusInput"
      responses:
        "200":
          description: Updated school status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/School"
  /schools/portfolio/analytics:
    get:
      operationId: getSchoolPortfolioAnalytics
      tags: [schools]
      summary: Read aggregated metrics for all school workspaces
      responses:
        "200":
          description: Aggregated portfolio metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioAnalytics"
  /schools/portfolio/users:
    get:
      operationId: getSchoolPortfolioUsers
      tags: [schools]
      summary: List staff access across all schools
      responses:
        "200":
          description: Staff roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortfolioUser"
  /schools/portfolio/messages:
    get:
      operationId: getSchoolPortfolioMessages
      tags: [messages]
      summary: List messages addressed to the system administrator
      responses:
        "200":
          description: Support messages from schools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortfolioMessage"
  /schools/{schoolId}/config:
    get:
      operationId: getSchoolConfig
      tags: [schools]
      summary: Read the school data configuration
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: Configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolConfig"
    put:
      operationId: updateSchoolConfig
      tags: [schools]
      summary: Replace the school data configuration
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolConfigInput"
      responses:
        "200":
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolConfig"
  /schools/{schoolId}/dashboard:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Read the school overview and grouped analytics
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /schools/{schoolId}/students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List students with optional filters
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - name: className
          in: query
          schema:
            type: ["string", "null"]
        - name: house
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: termKey
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
    post:
      operationId: createStudent
      tags: [students]
      summary: Create a student
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: Created student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
  /schools/{schoolId}/students/{studentId}:
    patch:
      operationId: updateStudent
      tags: [students]
      summary: Update a student
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/StudentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdate"
      responses:
        "200":
          description: Updated student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
    delete:
      operationId: deleteStudent
      tags: [students]
      summary: Delete a student
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/StudentId"
      responses:
        "204":
          description: Deleted
  /schools/{schoolId}/terms:
    get:
      operationId: listSchoolTerms
      tags: [schools]
      summary: List school terms
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: School terms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchoolTerm"
    post:
      operationId: createSchoolTerm
      tags: [schools]
      summary: Create a school term
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolTermInput"
      responses:
        "201":
          description: Updated school configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolConfig"
  /schools/{schoolId}/terms/{termKey}:
    patch:
      operationId: updateSchoolTerm
      tags: [schools]
      summary: Change term status or activate it
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - name: termKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolTermUpdate"
      responses:
        "200":
          description: Updated school configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolConfig"
    delete:
      operationId: deleteSchoolTerm
      tags: [schools]
      summary: Delete a closed, inactive term and its records
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - name: termKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Term and its records deleted
  /schools/{schoolId}/terms/{termKey}/activate:
    post:
      operationId: activateSchoolTerm
      tags: [schools]
      summary: Make a school term active
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - name: termKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated school configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolConfig"
  /schools/{schoolId}/terms/{termKey}/data:
    delete:
      operationId: clearSchoolTermMarks
      tags: [schools]
      summary: Clear marks from a closed term
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - name: termKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Term marks cleared
  /schools/{schoolId}/marks:
    get:
      operationId: listMarks
      tags: [marks]
      summary: List marks for the active term
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - name: termKey
          in: query
          required: true
          schema:
            type: string
        - name: className
          in: query
          schema:
            type: ["string", "null"]
        - name: subject
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Marks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mark"
    put:
      operationId: upsertMark
      tags: [marks]
      summary: Save one student's assessment mark
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkInput"
      responses:
        "200":
          description: Saved mark
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mark"
  /schools/{schoolId}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List the school message thread
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: createMessage
      tags: [messages]
      summary: Send a message to a school thread
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
components:
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SchoolId:
      name: schoolId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    School:
      type: object
      required: [id, name, slug, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        logoUrl:
          type: ["string", "null"]
        active:
          type: boolean
    SchoolRegistrationInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 3
          maxLength: 40
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        logoUrl:
          type: ["string", "null"]
        initialAdminEmail:
          type: ["string", "null"]
          format: email
        initialAdminName:
          type: ["string", "null"]
        address:
          type: string
        assessmentFields:
          type: array
          items:
            $ref: "#/components/schemas/AssessmentField"
    SchoolStatusInput:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
    SchoolConfig:
      type: object
      required: [schoolId, data, updatedAt]
      properties:
        schoolId:
          type: string
          format: uuid
        data:
          type: object
          additionalProperties: true
        updatedAt:
          type: string
          format: date-time
    SchoolConfigInput:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true
    SchoolTerm:
      type: object
      required: [key, label, status, active]
      properties:
        key:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [open, closed]
        active:
          type: boolean
    SchoolTermInput:
      type: object
      required: [termKey, label]
      properties:
        termKey:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
    SchoolTermUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [open, closed]
    DashboardSummary:
      type: object
      required: [studentCount, classCount, marksEntered, marksExpected, houses, recentActivity, configuredHouseCount, subjectCompletion, assessmentFields, activeTerm, events]
      properties:
        studentCount:
          type: integer
        classCount:
          type: integer
        marksEntered:
          type: integer
        marksExpected:
          type: integer
        houses:
          type: array
          items:
            $ref: "#/components/schemas/GroupedCount"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        configuredHouseCount:
          type: integer
        activeTerm:
          type: string
        assessmentFields:
          type: array
          items:
            $ref: "#/components/schemas/AssessmentField"
        subjectCompletion:
          type: array
          items:
            $ref: "#/components/schemas/SubjectCompletion"
        events:
          type: array
          items:
            $ref: "#/components/schemas/DashboardEvent"
    AssessmentField:
      type: object
      required: [name, field, max]
      properties:
        name:
          type: string
        field:
          type: string
          enum: [c1, c2, c3]
        max:
          type: number
    SubjectCompletion:
      type: object
      required: [className, subject, teacher, entered, expected, percentage]
      properties:
        className:
          type: string
        subject:
          type: string
        teacher:
          type: string
        entered:
          type: integer
        expected:
          type: integer
        percentage:
          type: number
    DashboardEvent:
      type: object
      required: [id, title, date]
      properties:
        id:
          type: string
        title:
          type: string
        date:
          type: string
    GroupedCount:
      type: object
      required: [label, count]
      properties:
        label:
          type: string
        count:
          type: integer
    ActivityItem:
      type: object
      required: [id, label, detail, createdAt]
      properties:
        id:
          type: string
        label:
          type: string
        detail:
          type: string
        createdAt:
          type: string
          format: date-time
    Student:
      type: object
      required: [id, schoolId, name, className, house, parentPhone, badges, subjects, createdAt]
      properties:
        id:
          type: string
          format: uuid
        schoolId:
          type: string
          format: uuid
        name:
          type: string
        className:
          type: string
        house:
          type: string
        parentPhone:
          type: ["string", "null"]
        badges:
          type: array
          items:
            type: string
        subjects:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    StudentInput:
      type: object
      required: [name, className, house]
      properties:
        name:
          type: string
          minLength: 1
        className:
          type: string
          minLength: 1
        house:
          type: string
          minLength: 1
        parentPhone:
          type: ["string", "null"]
        badges:
          type: array
          items:
            type: string
        subjects:
          type: array
          items:
            type: string
    StudentUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        className:
          type: string
          minLength: 1
        house:
          type: string
          minLength: 1
        parentPhone:
          type: ["string", "null"]
        badges:
          type: array
          items:
            type: string
    Mark:
      type: object
      required: [id, schoolId, studentId, termKey, subject, aoi, midterm, end]
      properties:
        id:
          type: string
          format: uuid
        schoolId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        termKey:
          type: string
        subject:
          type: string
        aoi:
          type: number
        midterm:
          type: number
        end:
          type: number
        enteredFields:
          type: array
          items:
            type: string
    MarkInput:
      type: object
      required: [studentId, termKey, subject]
      properties:
        studentId:
          type: string
          format: uuid
        termKey:
          type: string
        subject:
          type: string
        aoi:
          type: number
        midterm:
          type: number
        end:
          type: number
        enteredFields:
          type: array
          items:
            type: string
    PortfolioAnalytics:
      type: object
      required: [schoolCount, activeSchoolCount, suspendedSchoolCount, staffCount, studentCount, marksCompletionPercent, schools]
      properties:
        schoolCount:
          type: integer
        activeSchoolCount:
          type: integer
        suspendedSchoolCount:
          type: integer
        staffCount:
          type: integer
        studentCount:
          type: integer
        marksCompletionPercent:
          type: number
        schools:
          type: array
          items:
            type: object
            required: [schoolId, name, slug, active, studentCount, classCount, marksCompletionPercent]
            properties:
              schoolId:
                type: string
              name:
                type: string
              slug:
                type: string
              active:
                type: boolean
              studentCount:
                type: integer
              classCount:
                type: integer
              marksCompletionPercent:
                type: number
    PortfolioUser:
      type: object
      required: [schoolId, schoolName, email, role, subjects]
      properties:
        schoolId:
          type: string
        schoolName:
          type: string
        email:
          type: string
        displayName:
          type: ["string", "null"]
        role:
          type: string
        subjects:
          type: array
          items:
            type: string
    PortfolioMessage:
      type: object
      required: [id, schoolId, schoolName, senderName, message, direction, read, createdAt]
      properties:
        id:
          type: string
        schoolId:
          type: string
        schoolName:
          type: string
        senderName:
          type: string
        senderEmail:
          type: ["string", "null"]
        message:
          type: string
        direction:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Message:
      type: object
      required: [id, schoolId, senderName, message, direction, read, createdAt]
      properties:
        id:
          type: string
          format: uuid
        schoolId:
          type: string
          format: uuid
        senderName:
          type: string
        senderEmail:
          type: ["string", "null"]
        message:
          type: string
        direction:
          type: string
          enum: [in, out]
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
    MessageInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1

