plugins { id 'com.android.application' }

android {
    namespace 'com.jschools.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jschools.app'
        minSdk 23
        targetSdk 34
        // CI sets APP_VERSION_CODE (the build number) so every build can update the one before it.
        versionCode Integer.parseInt(System.getenv('APP_VERSION_CODE') ?: '1')
        versionName '1.0'
    }

    signingConfigs {
        release {
            def path = System.getenv('KEYSTORE_PATH')
            if (path) {
                storeFile file(path)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
