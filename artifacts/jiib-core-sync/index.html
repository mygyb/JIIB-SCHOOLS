<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J-SCHOOLS</title>
    <meta name="description" content="A role-based school operations workspace for student records, marks, family communication, and school administration." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="JIIB Core Sync" />
    <meta property="og:description" content="A role-based school operations workspace for student records, marks, family communication, and school administration." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JIIB Core Sync" />
    <meta name="twitter:description" content="A role-based school operations workspace for student records, marks, family communication, and school administration." />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#15203e" />
    <meta name="application-name" content="J-SCHOOLS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="J-SCHOOLS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      /* Launch screen: only when opened as an installed app, so the website never flashes before the login page. */
      #jiib-splash{display:none}
      html.is-app #jiib-splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#15203e;transition:opacity .35s ease}
      #jiib-splash img{width:min(46vw,200px);height:auto;border-radius:22%;animation:jiib-pop .6s ease both}
      #jiib-splash .bar{margin-top:28px;width:96px;height:3px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
      #jiib-splash .bar i{display:block;height:100%;width:40%;background:#fff;border-radius:3px;animation:jiib-load 1s ease-in-out infinite}
      #jiib-splash.hide{opacity:0;pointer-events:none}
      @keyframes jiib-pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
      @keyframes jiib-load{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
    </style>
    <script>
      try{if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)document.documentElement.classList.add('is-app')}catch(e){}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="jiib-splash" aria-hidden="true"><img src="/icons/icon-512.png" alt="J-SCHOOLS" width="200" height="200"><div class="bar"><i></i></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
